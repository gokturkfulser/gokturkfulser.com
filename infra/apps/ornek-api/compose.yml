# infra/apps/<ad>/compose.yml olarak üretilir (pnpm service:new <ad>); apps/_template ile aynı kurallar.
# Image: ghcr.io/gokturkfulser/gokturkfulser-ornek-api (private; VPS'te önce scripts/ghcr-login.sh).
# Yerelde: image'ı yerelde build et (services/ornek-api/README.md), sonra bu compose'u çalıştır.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: gokturkfulser-ornek-api

services:
  ornek-api:
    image: ghcr.io/gokturkfulser/gokturkfulser-ornek-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.ornek-api.rule: Host(`ornek-api.${DOMAIN:-gokturkfulser.com}`)
      traefik.http.routers.ornek-api.entrypoints: web
      traefik.http.services.ornek-api.loadbalancer.server.port: "8000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *logging

networks:
  edge:
    external: true
