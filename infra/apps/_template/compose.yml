# Yeni servis şablonu. Kullanım (VPS'te veya yerelde):
#   1) cp -r apps/_template apps/<ad>
#   2) apps/<ad>/compose.yml içinde "sablon" sözcüğünü <ad> ile değiştir
#      (name, image, router/service adı, Host kuralı, healthcheck portu/yolu)
#   3) cp apps/<ad>/.env.example apps/<ad>/.env  # gerekiyorsa doldur
#   4) VPS'te: infra/scripts/app-up.sh <ad>
# Image: ghcr.io/gokturkfulser/gokturkfulser-<app> (private; önce scripts/ghcr-login.sh).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: gokturkfulser-sablon

services:
  sablon:
    image: ghcr.io/gokturkfulser/gokturkfulser-sablon:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.sablon.rule: Host(`sablon.${DOMAIN:-gokturkfulser.com}`)
      traefik.http.routers.sablon.entrypoints: web
      traefik.http.services.sablon.loadbalancer.server.port: "3000"
      # Veritabanı (SQLite/Postgres) kullanan servis: yedekten ÖNCE konteynerde çalışacak dump komutu.
      # Dump, yedeklenen (com.gokturkfulser.backup etiketli) bir volume'a yazılmalı; backup.sh bu komutu
      # `sh -c` ile çalıştırır. Compose'ta "$" için "$$" yaz. Ayrıntı: infra/README.md > Yedek tutarlılığı.
      # SQLite (imajda sqlite3 CLI varsa: sqlite3 /data/app.db ".backup /data/dump.sqlite"):
      # com.gokturkfulser.backup.pre: >-
      #   python -c "import sqlite3;
      #   sqlite3.connect('/data/app.db').backup(sqlite3.connect('/data/dump.sqlite'))"
      # Postgres (veritabanı konteynerinde): com.gokturkfulser.backup.pre: "pg_dump -U $$POSTGRES_USER -Fc -f /backups/db.dump $$POSTGRES_DB"
    healthcheck:
      # Image'da wget/curl olmayabilir; gerekirse uygulamanın kendi komutunu kullan.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *logging

networks:
  edge:
    external: true
