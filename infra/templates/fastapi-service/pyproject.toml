[project]
name = "sablon"
version = "0.1.0"
description = "gokturkfulser FastAPI servisi"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic-settings>=2.11",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
# Uygulama bir paket değil; yalnızca bağımlılıklar kurulur (Docker'da .venv kopyalanır).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
