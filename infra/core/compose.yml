# Çekirdek: Traefik (label tabanlı routing) + cloudflared (tunnel gokturkfulser-vps).
# Host'a hiçbir port açılmaz; dış trafik yalnızca tunnel üzerinden gelir.
# "edge" ağını bu stack oluşturur; diğer stack'ler external olarak katılır.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: gokturkfulser-core

services:
  # Traefik, Docker API'sine soket yerine salt-okunur bir proxy üzerinden erişir.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging: *logging

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      # TLS Cloudflare'de sonlanır; Traefik yalnızca iç ağda HTTP konuşur.
      - --api.dashboard=false
      - --ping=true
      - --log.level=INFO
      - --accesslog=false
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - socket
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      # Zorunluluk core-up.sh'de denetlenir (yerelde cloudflared kapalı).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *logging

networks:
  edge:
    name: edge
  socket:
    name: socket
    internal: true
