name: infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # sürüm: kök package.json'daki packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc  # tek kaynak: Node sürümü köktek .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LF denetimi + shellcheck + actionlint + docker compose config (infra/scripts/validate.sh)
      - name: Doğrula
        run: pnpm infra:check
