  unvan:
    en: AI Engineer
    tr: Yapay Zekâ Mühendisi
  konum:
    en: Ankara, Türkiye
    tr: Ankara, Türkiye
  # Gelen kutusu aynı: Cloudflare Email Routing ile Gmail'e düşer.
  eposta: merhaba@gokturkfulser.com
  baglantilar:
    - ad: LinkedIn
      url: https://www.linkedin.com/in/gokturk-fulser/
    - ad: GitHub
      url: https://github.com/gokturkfulser
    - ad: Web
      url: https://gokturkfulser.com

ozet:
  en: >-
    AI engineer building LLM-powered products end to end, from retrieval
    systems and agents to the container infrastructure that runs them in
    production.
  tr: >-
    Büyük dil modelleriyle çalışan ürünleri uçtan uca geliştiren bir yapay
    zekâ mühendisi; arama sistemlerinden ajanlara, bunları üretimde
    çalıştıran container altyapısına kadar.

deneyim:
  - kurum: Enocta
    konum: Ankara
    web: https://www.enocta.com/
    roller:
      - unvan:
          en: AI Engineer
          tr: Yapay Zekâ Mühendisi
        baslangic: 2023-07
        bitis: null
        not:
          en: Joined as an AI engineering intern.
          tr: Yapay zekâ mühendisliği stajyeri olarak başladım.
        # "Yol" zaman çizelgesindeki tek cümle.
        kisa:
          en: Started as an intern; now I build AI products and the infrastructure that keeps them running.
          tr: Stajyer olarak başladım; bugün yapay zekâ ürünlerini ve onları ayakta tutan altyapıyı geliştiriyorum.
        maddeler:
          - en: >-
              Build AI features for Enocta's learning platform, including
              course assistants, persona assessments, transcription, a
              podcast studio and a slide studio.
            tr: >-
              Enocta'nın öğrenme platformu için yapay zekâ özellikleri
              geliştiriyorum: kurs asistanları, persona değerlendirmeleri,
              transkripsiyon, podcast stüdyosu ve slayt stüdyosu.
          - en: >-
              Design and ship company-specific applications on LLMs from
              OpenAI, Anthropic and Google.
            tr: >-
              OpenAI, Anthropic ve Google modelleri üzerinde şirkete özel
              uygulamalar tasarlayıp yayına alıyorum.
          - en: >-
              Build and tune RAG systems on Weaviate and FAISS vector
              databases for semantic search and retrieval.
            tr: >-
              Anlamsal arama için Weaviate ve FAISS vektör veritabanları
              üzerinde RAG sistemleri kurup iyileştiriyorum.
          - en: >-
              Develop AI agents and multi-agent workflows with CrewAI and
              smolagents.
            tr: >-
              CrewAI ve smolagents ile yapay zekâ ajanları ve çok ajanlı iş
              akışları geliştiriyorum.
          - en: >-
              Build multimodal features with speech-to-text (Whisper),
              text-to-speech (ElevenLabs, OpenAI TTS) and generative media
              models served through fal and Groq.
            tr: >-
              Konuşmadan metne (Whisper), metinden konuşmaya (ElevenLabs,
              OpenAI TTS) ve fal ile Groq üzerinden sunulan üretken medya
              modelleriyle çok modlu özellikler geliştiriyorum.
          - en: >-
              Run a production Docker Swarm environment of 15–20 FastAPI
              microservices, with CI/CD on Jenkins, images on Nexus and
              routing through Nginx Proxy Manager.
            tr: >-
              15–20 FastAPI mikroservisinden oluşan üretim Docker Swarm
              ortamını yönetiyorum; CI/CD için Jenkins, imajlar için Nexus,
              yönlendirme için Nginx Proxy Manager.
          - en: >-
              Work across the data and messaging layer with SQL Server,
              SQLAlchemy and RabbitMQ.
            tr: >-
              Veri ve mesajlaşma katmanında SQL Server, SQLAlchemy ve
              RabbitMQ ile çalışıyorum.
          - en: >-
              Prototype quickly with Python, Pydantic, Instructor and
              Streamlit, and run local inference with Ollama and LM Studio.
            tr: >-
              Python, Pydantic, Instructor ve Streamlit ile hızlı prototip
              geliştiriyor; Ollama ve LM Studio ile yerel çıkarım
              yapıyorum.

  - kurum: Roar Games Studio
    konum: Ankara
    web: ""
    roller:
      - unvan:
          en: Game Developer
          tr: Oyun Geliştirici
        baslangic: 2021-07
        bitis: 2022-08
        kisa:
          en: Built game mechanics in Unity and C#; this is where my career began.
          tr: Unity ve C# ile oyun mekanikleri geliştirdim; meslek hayatım burada başladı.
        maddeler:
          - en: >-
              Built game mechanics and core gameplay systems in Unity3D and
              C#.
            tr: >-
              Unity3D ve C# ile oyun mekanikleri ve temel oynanış sistemleri
              geliştirdim.
          - en: >-
              Worked with artists and designers to integrate assets and
              optimize performance across platforms and devices.
            tr: >-
              Sanatçı ve tasarımcılarla birlikte görselleri oyuna entegre
              edip farklı platform ve cihazlarda performansı iyileştirdim.
          - en: >-
              Wrote and maintained clean code through code reviews and
              debugging sessions.
            tr: >-
              Kod incelemeleri ve hata ayıklama oturumlarıyla temiz ve
              bakımı kolay kod yazdım.

egitim:
  - kurum:
      en: Middle East Technical University
      tr: Orta Doğu Teknik Üniversitesi
    derece:
      en: BSc in Computer Engineering
      tr: Bilgisayar Mühendisliği, Lisans
    konum: Ankara
    web: https://www.metu.edu.tr/
    baslangic: 2016
    bitis: 2024
    kisa:
      en: Studied computer engineering.
      tr: Bilgisayar mühendisliği okudum.

# "Yol" zaman çizelgesinde deneyim ve eğitimin dışında kalan duraklar (yıl sırasına göre araya girer).
duraklar:
  - kurum:
      en: My own projects
      tr: Kendi projelerim
    baslangic: 2026
    bitis: null
    href: projeler
    kisa:
      en: "Back to making games, this time my own: a daily word game and an Anatolian adventure for kids."
      tr: "Oyun yapmaya kendi projelerimle döndüm: günlük bir kelime oyunu ve çocuklar için bir Anadolu macerası."

# "Sayılarla" şeridi: elle girilen sayılar. Yayındaki proje ve yazı sayısı otomatik hesaplanır; sıfır/boş olan gösterilmez.
sayilar:
  - deger: 15–20
    etiket:
      en: microservices in production
      tr: üretimde mikroservis

# "Şu sıralar": gruplar ve öğeler (slug verilirse site içi proje sayfasına bağlanır). Boş grup gösterilmez;
# izlediklerim Letterboxd şeridinden gelir. Doldurmak için ogeler listesine { metin: { en, tr } } ekleyin.
su_siralar:
  - baslik:
      en: Working on
      tr: Üzerinde çalıştığım
    # Perde Perde Anadolu yayında; "üzerinde çalıştığım" değil, Projeler'de ve özgeçmişte yer alır. Boş grup gösterilmez.
    ogeler: []
  - baslik:
      en: Following
      tr: Takip ettiğim
    ogeler: []

projeler:
  # Site içindeki proje sayfalarına bağlanır (slug).
  - slug: perde-perde-anadolu
  - slug: kelime-avi

diller:
  - ad:
      en: Turkish
      tr: Türkçe
    seviye:
      en: Native
      tr: Ana dil
  - ad:
      en: English
      tr: İngilizce
    seviye:
      en: Professional
      tr: Profesyonel

beceriler:
  - grup:
      en: AI & LLM
      tr: Yapay zekâ ve LLM
    # "Araç kutusu"nda grup başlığının altındaki cümle; etiketlerin ilk 6'sı orada, tamamı "Özgeçmişin tamamı"nda görünür.
    cumle:
      en: Turning models into products, from prompts and agents to local inference.
      tr: "Modelleri ürüne dönüştürüyorum: istemlerden ajanlara, yerel çıkarıma kadar."
    ogeler: [Generative AI, RAG, Prompt engineering, AI agents, CrewAI, smolagents, Instructor, Local inference]
  - grup:
      en: Retrieval & data
      tr: Arama ve veri
    cumle:
      en: Semantic search built on vector and relational databases.
      tr: Anlamsal aramayı vektör ve ilişkisel veritabanlarının üzerine kuruyorum.
    ogeler: [Weaviate, FAISS, Semantic search, Vector databases, SQL, SQL Server, SQLAlchemy]
  - grup:
      en: Speech & media
      tr: Ses ve medya
    cumle:
      en: Features that turn speech into text, and text into voice and media.
      tr: Konuşmayı metne, metni sese ve görüntüye çeviren özellikler kuruyorum.
    ogeler: [Speech-to-text, Text-to-speech, Whisper, ElevenLabs, fal, Groq]
  - grup:
      en: Backend & infrastructure
      tr: Backend ve altyapı
    cumle:
      en: I write services, ship them in containers and keep them running.
      tr: Servisleri yazıyor, konteynerlerde yayına alıyor ve ayakta tutuyorum.
    ogeler: [Python, FastAPI, Streamlit, Docker, Docker Swarm, Jenkins, Nexus, Nginx Proxy Manager, RabbitMQ, Linux, Git]
  - grup:
      en: Other languages & tools
      tr: Diğer diller ve araçlar
    cumle:
      en: "Where I started: games in Unity and C#, with C and C++ close by."
      tr: "Başladığım yer: Unity ve C# ile oyunlar, yanında C ve C++."
    ogeler: [C#, C++, C, Unity3D]